# Builds the packaged macOS Vigil binary on GitHub's macOS runners
# (PyInstaller cannot cross-compile) and uploads the zip to a release.
# Trigger: gh workflow run build-macos.yml -f release_tag=v2.0
name: build-macos

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload the assets to"
        required: true
        default: "v2.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon
            arch: arm64
          # The macos-13 (Intel) leg was removed: the image is retired, so the
          # job never picked up a runner and sat queued until GitHub cancelled
          # it at 24h -- which marked otherwise-green runs as cancelled.
          # timeout-minutes does not help; it only counts execution, not queue.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      # Same onefile recipe as the Windows build documented in vigil.py,
      # with ':' add-data separators (POSIX) instead of ';'.
      - name: Build
        run: |
          pyinstaller --onefile --name Vigil \
            --add-data "index.html:." \
            --add-data "core:core" \
            --add-data "static:static" \
            vigil.py

      # Boot the frozen binary headless and require the HTTPS UI to answer.
      - name: Smoke test
        run: |
          set -e
          ./dist/Vigil --no-browser --port 9443 &
          PID=$!
          for i in $(seq 1 60); do
            sleep 2
            code=$(curl -k -s -o /dev/null -w '%{http_code}' https://127.0.0.1:9443/ || true)
            if [ "$code" = "200" ]; then
              echo "smoke OK (HTTP $code)"
              kill $PID
              exit 0
            fi
            if ! kill -0 $PID 2>/dev/null; then
              echo "FAIL: Vigil exited before becoming ready"
              exit 1
            fi
          done
          echo "FAIL: Vigil never became ready"
          kill $PID
          exit 1

      - name: Package
        run: |
          VERSION="${{ github.event.inputs.release_tag }}"
          VERSION="${VERSION#v}"
          rm -f dist/*.pem dist/config.json dist/status.json dist/vigil.log
          (cd dist && zip -qy "Vigil-${VERSION}-macos-${{ matrix.arch }}.zip" Vigil)
          echo "ASSET=dist/Vigil-${VERSION}-macos-${{ matrix.arch }}.zip" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.inputs.release_tag }}" "$ASSET" --clobber
